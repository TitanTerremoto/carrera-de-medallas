<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ef476f" />
    <title>Control · Pokémon: Carrera de Medallas</title>
    <meta name="description" content="Control del jugador para Carrera de Medallas." />
    <link rel="stylesheet" href="styles.css?v=52" />
    <link rel="stylesheet" href="control.css?v=52" />
  </head>
  <body class="control">
    <header class="ctrl-top">
      <strong class="ctrl-brand"><svg class="brand-ball" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#fff" stroke="#1f2933" stroke-width="4"/><path d="M3 32 A29 29 0 0 1 61 32 Z" fill="#e3350d" stroke="#1f2933" stroke-width="4"/><rect x="3" y="29" width="58" height="6" fill="#1f2933"/><circle cx="32" cy="32" r="10" fill="#fff" stroke="#1f2933" stroke-width="4"/></svg><span class="brand-poke">Pokémon</span></strong>
      <span class="ctrl-status" id="ctrlStatus">Sin conectar</span>
    </header>

    <main class="ctrl-main">
      <!-- Ingreso del código de sala -->
      <section class="card ctrl-screen" id="scrCode" hidden>
        <h1>Entrar a una sala</h1>
        <p>Escribe el código que aparece en la pantalla principal.</p>
        <form id="codeForm" class="ctrl-code-form" novalidate>
          <input id="codeInput" class="name-input ctrl-code-input" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" aria-label="Código de sala" />
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </section>

      <!-- Conectando -->
      <section class="card ctrl-screen ctrl-center" id="scrConnecting" hidden>
        <div class="ctrl-spinner" aria-hidden="true"></div>
        <p id="connectingText">Conectando con la sala…</p>
      </section>

      <!-- Elegir asiento, nombre y criatura -->
      <section class="card ctrl-screen" id="scrJoin" hidden>
        <h1 id="joinTitle">Elige tu asiento</h1>
        <div class="ctrl-seats" id="seatList" role="radiogroup" aria-label="Asientos"></div>
        <div id="joinProfile">
          <label class="seat-label" for="nameInput">Tu nombre</label>
          <input id="nameInput" class="name-input" type="text" maxlength="16" autocomplete="off" placeholder="Tu nombre" />
          <span class="seat-label">Tu ficha</span>
          <div class="creature-picker ctrl-picker" id="creaturePicker" role="group" aria-label="Ficha"></div>
        </div>
        <p class="ctrl-error" id="joinError" role="alert"></p>
        <button type="button" class="btn btn-primary btn-big ctrl-wide" id="btnJoin">Unirme</button>
      </section>

      <!-- Sala de espera -->
      <section class="card ctrl-screen" id="scrWait" hidden>
        <div class="ctrl-me" id="waitMe"></div>
        <p class="ctrl-center-text">Esperando que la partida comience en la pantalla principal…</p>
        <ul class="ctrl-lobby" id="lobbyList"></ul>
        <button type="button" class="btn btn-ghost ctrl-wide" id="btnLeave">Cambiar de asiento</button>
      </section>

      <!-- Partida -->
      <section class="ctrl-screen ctrl-play" id="scrPlay" hidden>
        <div class="mini-board" id="miniBoard" aria-label="Tablero"></div>
        <div class="card ctrl-action" id="actionCard" aria-live="polite"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="vendor/peerjs.min.js"></script>
    <script src="config.js?v=52"></script>
    <script src="pokedata.js?v=52"></script>
    <script src="art.js?v=52"></script>
    <script src="dom.js?v=52"></script>
    <script src="sound.js?v=52"></script>
    <script src="net-protocol.js?v=52"></script>
    <script src="control.js?v=52"></script>
  </body>
</html>
